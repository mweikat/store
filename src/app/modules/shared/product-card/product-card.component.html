<div class="card h-100 product-card shadow-sm border-0">
  <a [routerLink]="'/product/' + product.url" class="text-decoration-none text-dark d-flex flex-column h-100">
    <div class="product-image-wrapper p-2 bg-white rounded-top position-relative">
      <img
        appImgBroken
        [src]="mainImage"
        class="card-img-top product-image"
        [alt]="product.name"
        loading="lazy"
        width="200"
        height="200">

      <!-- Discount Badge -->
      <span class="badge bg-danger position-absolute top-0 start-0 m-2 px-2 py-1 fs-7 fw-bold rounded" *ngIf="discountPercent">
        -{{ discountPercent }}%
      </span>

      <!-- Stock Overlay / Badge -->
      <div class="stock-overlay d-flex align-items-center justify-content-center" *ngIf="product.stock === 0">
        <span class="badge bg-secondary px-3 py-2 fs-6 shadow-sm">Agotado</span>
      </div>
    </div>

    <div class="card-body d-flex flex-column justify-content-between text-center p-3">
      <div>
        <p class="card-title product-title mb-2 fw-semibold" [title]="product.name">
          {{ product.name }}
        </p>

        <div class="product-price mb-2" *ngIf="product.price && product.price > 0">
          <ng-container *ngIf="product.priceSale && product.priceSale < product.price; else regularPriceOnly">
            <span class="text-muted text-decoration-line-through me-1 normal-price small">
              ${{ product.price | number | comaToDot }}
            </span>
            <span class="text-danger fw-bold sale-price fs-6">
              ${{ product.priceSale | number | comaToDot }}
            </span>
          </ng-container>
          <ng-template #regularPriceOnly>
            <span class="fw-bold normal-price text-dark fs-6">
              ${{ product.price | number | comaToDot }}
            </span>
          </ng-template>
        </div>
      </div>

      <div class="card-actions mt-2">
        <span
          class="btn btn-primary-c1 btn-sm w-100 fw-semibold action-btn d-block"
          [class.disabled]="product.stock === 0">
          <i class="bi bi-cart-plus me-1" *ngIf="product.stock > 0"></i>
          {{ product.stock > 0 ? 'Ver producto' : 'Sin stock' }}
        </span>
      </div>
    </div>
  </a>
</div>
