<div class="slide1">
  <div class="visually-hidden">
    <h4 class="fw-bold">{{title}}</h4>
    <div [innerHTML]="desc?desc:'' |htmlSanitize :'html'"></div>
  </div>
  <div id="carouselExampleIndicators" class="carousel slide" data-bs-ride="carousel" [attr.data-bs-interval]="carouselInterval">
    <!-- Puntos indicadores -->
    <div class="carousel-indicators">
      @for (slide of slides(); track slide.id; let i = $index) {
        <button
          type="button"
          data-bs-target="#carouselExampleIndicators"
          [attr.data-bs-slide-to]="i"
          [class.active]="i === 0"
          [attr.aria-current]="i === 0 ? 'true' : null"
          [attr.aria-label]="'Slide ' + (i + 1)"
        ></button>
      }
    </div>
  
    <!-- Imágenes del carrusel -->
    <div class="carousel-inner">
      @if(hasSlides()) {
        @for(slide of slides(); track slide.id; let i = $index ){
          <div class="carousel-item" [class.active]="i === 0">
            <ng-container *ngIf="slide.link; else noLink">
              <a [routerLink]="slide.link">
                <picture>
                  <source media="(max-width: 768px)" [srcset]="slide.img_cellphone">
                  <img
                    [src]="slide.img"
                    class="d-block img-fluid slide-img"
                    [alt]="'Slide ' + (i + 1)"
                    [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
                    [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                    width="1200"
                    height="500">
                </picture>
              </a>
            </ng-container>
            <ng-template #noLink>
              <picture>
                <source media="(max-width: 768px)" [srcset]="slide.img_cellphone">
                <img
                  [src]="slide.img"
                  class="d-block img-fluid slide-img"
                  [alt]="'Slide ' + (i + 1)"
                  [attr.fetchpriority]="i === 0 ? 'high' : 'auto'"
                  [attr.loading]="i === 0 ? 'eager' : 'lazy'"
                  width="1200"
                  height="500">
              </picture>
            </ng-template>
          </div>
        }
      } @else {
        <div class="carousel-item active">
          <picture>
            <source media="(max-width: 768px)" srcset="assets/images/slide-home/slide_loading_phone.png">
            <img src="assets/images/slide-home/slide_loading.png" class="d-block img-fluid slide-img" alt="Cargando..." width="1200" height="500" fetchpriority="high" loading="eager">
          </picture>
        </div>
      }
    </div>
  
    <!-- Flechas de navegación -->
    <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="prev">
      <span class="carousel-control-prev-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Anterior</span>
    </button>
    <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleIndicators" data-bs-slide="next">
      <span class="carousel-control-next-icon" aria-hidden="true"></span>
      <span class="visually-hidden">Siguiente</span>
    </button>
  </div>
</div>
