<div class="layout">
    <app-top></app-top>
    <app-top-2></app-top-2>
    <app-header></app-header>
    
    <div class="content">
      <main id="main-content" role="main">
        <router-outlet></router-outlet>
        <app-spinner></app-spinner>
        @defer (on idle) {
        <app-message-toast></app-message-toast>
        }

    </div>

      <app-footer></app-footer>
    }@placeholder {
      <div>Loading...</div>
    }
  </div>
